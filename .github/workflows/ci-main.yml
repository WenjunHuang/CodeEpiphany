name: CI Main

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build with IntelliJ ${{ matrix.intellij-version }}
    
    strategy:
      matrix:
        java-version: [17]
        intellij-version: [233, 241, 252]
      fail-fast: true  # 允许其他版本继续构建，即使某个版本失败
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Setup SBT
      uses: olafurpg/setup-scala@v14
      with:
        java-version: ${{ matrix.java-version }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Cache SBT dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.sbt
          ~/.ivy2/cache
          ~/.cache/coursier
        key: ${{ runner.os }}-sbt-intellij${{ matrix.intellij-version }}-${{ hashFiles('**/build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
        restore-keys: |
          ${{ runner.os }}-sbt-intellij${{ matrix.intellij-version }}-
          ${{ runner.os }}-sbt-
          
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('webview/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node
          
    - name: Install npm dependencies
      run: |
        cd webview
        npm i

    - name: Show IntelliJ version configuration
      run: sbt -Dintellij.version=${{ matrix.intellij-version }} 'show intellijBuild'
      env:
        INTELLIJ_VERSION: ${{ matrix.intellij-version }}

    - name: Publish plugin to JetBrains Marketplace
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: sbt -Dintellij.version=${{ matrix.intellij-version }} clean packageArtifact publishPlugin
      env:
        IJ_PLUGIN_REPO_TOKEN: ${{ secrets.IJ_PLUGIN_REPO_TOKEN }}
