version = 3.7.15
runner.dialect = scala3

maxColumn = 100
preset=default
indent.defnSite = 2
optIn.configStyleArguments = false

project.git = true
spaces.inImportCurlyBraces = true
includeCurlyBraceInSelectChains = false
rewrite.rules = [SortImports, RedundantBraces, RedundantParens, SortModifiers]
align.preset = more

