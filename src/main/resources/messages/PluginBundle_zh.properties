needFetchQuestions.tips=登录后，点击“更新题目集”按钮以启动完整的题库同步。这是必要的，因为{0}平台目前提供的原生搜索能力有限，因此下载所有问题到本地可以更方便地搜索和引用它们。同步通常在2-5秒内完成（取决于网络延迟）
