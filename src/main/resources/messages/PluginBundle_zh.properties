settings.databaseFolder.label=数据库文件夹：
settings.databaseFolder.title=存储数据库的文件夹
settings.databaseFolder.description=<html><body>\ 
<h3>数据库配置说明</h3>\
 <p>此插件使用本地SQLite数据库存储您的解题数据和提交历史记录。<br> 为确保数据同步顺利进行：</p>\
  <ul>\
    <li><b>多IDE/项目支持：</b><br>\
      您可以通过插件设置在不同的JetBrains IDE和项目中配置相同的数据库文件路径。<br> 这使得所有编码活动的数据可以集中管理。\
    </li>\
    <li><b>数据隐私保证：</b><br>\
      您的所有数据都仅存储在本地机器上。<br> 没有信息上传到任何外部服务器，确保数据安全。\
    </li>\
    <li><b><font color='#F44336'>重要的安全提示：</font></b><br>\
      数据库结构由插件自动维护。<br> 手动修改数据库文件可能会导致：\
      <ul>\
        <li>数据损坏</li>\
        <li>插件功能故障</li>\
      </ul>\
      为确保数据安全和插件稳定，我们强烈建议不要直接修改数据库。\
    </li>\
  </ul>\
  <h3>平台登录Cookie存储</h3>\
  <p>所有平台的Cookie由<a href='https://plugins.jetbrains.com/docs/intellij/persisting-sensitive-data.html'>凭据存储</a>管理。</p> \
</body></html>
