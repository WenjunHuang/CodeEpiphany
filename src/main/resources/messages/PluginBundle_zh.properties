settings.databaseFolder.label=数据库文件夹：
settings.databaseFolder.title=存储数据库的文件夹
settings.databaseFolder.description=<html><body>\
  <h3>数据库配置通知</h3>\
  <p>此插件使用本地SQLite数据库来存储您的解题数据和提交历史。<br> 为了确保工作流中的数据无缝同步：</p>\
  <ul>\
    <li><b>多IDE/项目支持：</b><br>\
      您可以通过插件设置在不同的JetBrains IDE和项目中配置相同的数据库文件路径。<br> 这将为您的所有编码活动启用集中式数据管理。\
    </li>\
    <li><b>数据隐私保证：</b><br>\
      您的所有数据都存储在本地机器上。<br> 不会将任何信息上传到外部服务器，确保数据完全安全。\
    </li>\
    <li><b><font color="#F44336">重要安全建议：</font></b><br>\
      数据库结构由插件自动维护。<br> 手动修改数据库文件可能导致：\
      <ul>\
        <li>数据损坏</li>\
        <li>插件功能崩溃</li>\
      </ul>\
      为了您的数据安全和插件稳定性，我们强烈建议不要直接编辑数据库。\
    </li>\
  </ul>\
  <h3>平台登录Cookie存储</h3>\
  <p>所有平台的Cookie由<a href='https://plugins.jetbrains.com/docs/intellij/persisting-sensitive-data.html'>凭证存储</a>维护。</p> \
</body></html>
