# Database Settings
settings.databaseFolder.label=Database Folder:
settings.databaseFolder.title=Folder For Storing Database
settings.databaseFolder.description=<html><body>\
  <h3>Database Configuration Notice</h3>\
  <p>This plugin utilizes a local SQLite database to store your problem-solving data and submission history.<br> To ensure seamless data synchronization across your workflow:</p>\
  <ul>\
    <li><b>Multi-IDE/Project Support:</b><br>\
      You may configure the same database file path across different JetBrains IDEs and projects through plugin settings.<br> This enables centralized data management for all your coding activities.\
    </li>\
    <li><b>Data Privacy Assurance:</b><br>\
      All your data is stored locally on your machine.<br> No information is uploaded to any external servers, ensuring complete data security.\
    </li>\
    <li><b><font color="#F44336">Important Security Advisory:</font></b><br>\
      The database structure is automatically maintained by the plugin.<br> Manual modification of the database files may lead to:\
      <ul>\
        <li>Data corruption</li>\
        <li>Plugin functionality breakdown</li>\
      </ul>\
      For your data safety and plugin stability, we strongly advise against direct database editing.\
    </li>\
  </ul>\
  <h3>Platform Login Cookies Storage</h3>\
  <p>All platforms' cookies are maintained by the <a href='https://plugins.jetbrains.com/docs/intellij/persisting-sensitive-data.html'>Credentials Store</a>.</p> \
</body></html>
