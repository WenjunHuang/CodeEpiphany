<!DOCTYPE html>
<html lang="" data-overlayscrollbars-initialize>
<head>
    <meta charset="UTF-8">
    <style>
    </style>
    <title>Description Viewer</title>
    <!-- style of jcef scrollbar --->
    <link type="text/css" href="overlayscrollbars.css" rel="stylesheet"/>
    <script type="text/javascript" src="overlayscrollbars.browser.es6.js"></script>
    <link id="scrollbarsStyle" rel="stylesheet" type="text/css" href="scrollbars.css"/>
    <!-- style of dojo -->
    <link id="descriptionStyle" rel="stylesheet" type="text/css" href="descriptionStyle.css"/>
    <link id="dojoStyle" rel="stylesheet" type="text/css" href="dojo.css"/>
</head>
<body data-overlayscrollbars-initialize>
<div id="container">
    {{questionDescription}}
</div>

<script>
    const MAX_ZOOM = 500;
    const MIN_ZOOM = 25;
    const gIsDebug = (new URL(window.location.href).searchParams.get('debug') != null);

    OverlayScrollbarsGlobal.OverlayScrollbars(document.body, {});

    const gState = {
        'zoom': 100,
    }


    const gStyles = {
        'scrollbars': document.getElementById('scrollbarsStyle'),
        'description': document.getElementById('descriptionStyle'),
        'dojo': document.getElementById('dojoStyle'),
    }

    function setZoom(zoom = 100) {
        zoom = normalizeZoom(zoom);

        if (zoom === 100) {
            document.getElementById("container").style.zoom = '';
        } else {
            document.getElementById("container").style.zoom = `${zoom}%`;
        }

        gState.zoom = zoom;

        _updateInfo();
    }

    function zoomIn() {
        setZoom(gState.zoom * 1.2);
    }

    function zoomOut() {
        setZoom(gState.zoom / 1.2);
    }

    function actualZoom() {
        setZoom(100);
    }

    function normalizeZoom(zoom) {
        zoom = Math.min(Math.max(zoom, MIN_ZOOM), MAX_ZOOM);
        return zoom;
    }

    let _init = function () {
        if (dojoInit && typeof dojoInit === 'function') dojoInit();

        // OverlayScrollbarsGlobal.OverlayScrollbars(document.body, {});
        setZoom(gState.zoom);
        window.removeEventListener('load', _init);
    }

    window.addEventListener('load', _init);

    let sendInfo = function (info_string) {/** will set to be a plugin code invoker **/
    }

    function reloadStyles() {
        gStyles.scrollbars.href = _setTimestamp(gStyles.scrollbars.href);
        gStyles.description.href = _setTimestamp(gStyles.description.href);
        gStyles.dojo.href = _setTimestamp(gStyles.dojo.href);
    }

    function _setTimestamp(url) {
        let patchedUrl = new URL(url);
        patchedUrl.searchParams.set('timestamp', new Date().getTime().toString());
        return patchedUrl.toString();
    }

    function _updateInfo() {
        let info = {
            'zoom': gState.zoom,
            'canZoomIn': gState.zoom < MAX_ZOOM,
            'canZoomOut': gState.zoom > MIN_ZOOM,
        }
        sendInfo(JSON.stringify(info));
    }
</script>
</body>

</html>
